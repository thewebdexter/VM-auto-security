# TWDxOSOptimisation — dnf-automatic policy (RHEL/Fedora/CentOS family) v2.0.0
# https://github.com/TheWebDexterTech/TWDxOSOptimisation
#
# Installed to /etc/dnf/automatic.conf. Role equivalent to Debian's
# unattended-upgrades: applies updates on the dnf-automatic-install.timer.
#
# DEFAULT CHANGED in v2.0.0: upgrade_type = security. A hands-off *security*
# tool should not push feature/bugfix updates unattended — set this back to
# "default" if you want every available update applied automatically.

[commands]
upgrade_type = security
random_sleep = 300
network_online_timeout = 60
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
# stdio → journald (no MTA assumed). install.sh appends an [email] section
# and switches emit_via to "stdio, email" when ADMIN_EMAIL is set.
emit_via = stdio
system_name = TWDxOSOptimisation

[base]
debuglevel = 1
