# TWDxOSOptimisation — journald persistence & retention (v2.0.0)
# Installed to /etc/systemd/journald.conf.d/99-twdxos.conf
#
# Rationale: a default journald is often volatile (lost on reboot) or
# unbounded. Persist logs across reboots for post-incident forensics, but
# cap total size and retention so the journal never fills the disk.

[Journal]
Storage=persistent
Compress=yes
Seal=yes
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=100M
MaxRetentionSec=1month
MaxFileSec=1week
ForwardToSyslog=no
RateLimitIntervalSec=30s
RateLimitBurst=10000
