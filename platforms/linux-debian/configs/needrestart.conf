# TWDxOSOptimisation — needrestart policy (v2.0.0)
# https://github.com/liske/needrestart
#
# DEFAULT CHANGED in v2.0.0: restart mode is now 'l' (LIST ONLY).
# needrestart will report which services are running outdated code after an
# apt run, but will NOT restart them. Silently bouncing MySQL / PHP-FPM /
# nginx mid-request during an unattended upgrade is an availability decision
# this tool should not make for you. Set to 'a' below to opt back into
# fully-automatic restarts.
$nrconf{restart} = 'l';

# Print kernel hints to stderr only — never an interactive prompt.
$nrconf{kernelhints} = -1;

# Binaries to ignore (not long-running daemons).
$nrconf{blacklist} = [
    qr(^/usr/bin/sudo(\.dpkg-new)?$),
    qr(^/sbin/(dhclient|dhcpcd5|pump|udhcpc)(\.dpkg-new)?$),
    qr(^/usr/bin/apt-get(\.dpkg-new)?$),
];

# Services that must never be auto-restarted even if mode is later set to 'a'.
$nrconf{override_rc} = {
    qr(^dbus) => 0,
    qr(^gdm) => 0, qr(^kdm) => 0, qr(^nodm) => 0,
    qr(^sddm) => 0, qr(^wdm) => 0, qr(^xdm) => 0,
    qr(^lightdm) => 0, qr(^slim) => 0, qr(^lxdm) => 0,
    qr(^bird) => 0,
    qr(^network) => 0,
    qr(^NetworkManager) => 0,
    qr(^ModemManager) => 0,
    qr(^wpa_supplicant) => 0,
    qr(^openvpn) => 0,
    qr(^quagga) => 0,
    qr(^frr) => 0,
    qr(^tinc) => 0,
    qr(^(open|free|libre|strong)swan) => 0,
    qr(^bluetooth) => 0,
    qr(^ssh) => 0,
    qr(^sshd) => 0,
    qr(^getty@.+\.service) => 0,
    qr(^serial-getty@.+\.service) => 0,
    qr(^user@\d+\.service) => 0,
    qr(^zfs-fuse) => 0,
    qr(^lxcfs) => 0,
    qr(^libvirt) => 0,
    qr(^virtlogd) => 0,
    qr(^virtlockd) => 0,
    qr(^docker) => 0,
    qr(^containerd) => 0,
    qr(^google-(shutdown|startup)-scripts\.service$) => 0,
    qr(^emergency\.service$) => 0,
    qr(^rescue\.service$) => 0,
    qr(^elogind) => 0,
    qr(^apt-daily\.service$) => 0,
    qr(^apt-daily-upgrade\.service$) => 0,
    qr(^unattended-upgrades\.service$) => 0,
    qr(^cloud-(init-local|init|config|final)\.service$) => 0,
    qr(^cron-.*\.service$) => 0,
    qr(^rc-local\.service$) => 0,
    qr(^systemd-logind) => 0,
};

$nrconf{override_cont} = {};

$nrconf{blacklist_interp} = [
    qr(^/tmp/), qr(^/var/), qr(^/run/),
];

$nrconf{blacklist_mappings} = [
    qr(^/(SYSV00000000( \(deleted\))?|drm(\s|$)|dev/)),
    qr(^/memfd:),
    qr(^/\[aio\]),
    qr#/orcexec\.[\w\d]+( \(deleted\))?$#,
    qr(/#\d+( \(deleted\))?$),
    qr#/jna\d+\.tmp( \(deleted\))?$#,
    qr#^(/var)?/tmp/#,
    qr#^(/var)?/run/#,
];

$nrconf{skip_mapfiles} = -1;

if(-d q(/etc/needrestart/conf.d)) {
    foreach my $fn (sort </etc/needrestart/conf.d/*.conf>) {
        eval do { local(@ARGV, $/) = $fn; <>};
        die "Error parsing $fn: $@" if($@);
    }
}
